<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Generador de Códigos QR Gratis</title>
<style>
body{font-family:'Segoe UI',sans-serif;background:#f4f6f9;margin:0;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{background:#fff;padding:25px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.05);max-width:400px;width:100%;text-align:center}
input{width:100%;padding:10px;margin:15px 0;border:1px solid #cbd5e1;border-radius:6px;box-sizing:border-box}
button{width:100%;padding:12px;background:#0284c7;border:none;color:#fff;font-weight:bold;border-radius:6px;cursor:pointer}
.res{margin-top:20px;padding:15px;display:none;background:#f0f9ff;border:1px solid #bae6fd;border-radius:6px}
.ad{display:none;margin-top:15px;min-height:100px}
</style>
</head>
<body>
<div class="box">
<h2>Generador de Códigos QR</h2>
<input type="text" id="txt" placeholder="https://ejemplo.com">
<button onclick="makeQR()">Generar QR</button>
<div id="box" class="res"><strong>¡Creado!</strong><div id="out" style="margin-top:10px"></div></div>
<div id="ads" class="ad"><div id="container-e8c895e6c70ade8e4ef4a72354f42e97"></div></div>
</div>
<script>
function showAds(){
const c=document.getElementById('ads');
if(!window.adScriptLoaded){
window.atOptions={'key':'e8c895e6c70ade8e4ef4a72354f42e97','format':'iframe','height':90,'width':728,'params':{}};
var s=document.createElement('script');s.type='text/javascript';s.async=!0;
s.src=['https://','bagelstoppage.','com/','e8c895e6c70ade8e4ef4a72354f42e97/','invoke.js'].join('');
c.appendChild(s);window.adScriptLoaded=!0
}
c.style.display='block'
}
function makeQR(){
const v=document.getElementById('txt').value.trim();
if(!v){alert('Error');return}
// ПУЛЕНЕПРОБИВАЕМЫЙ ОБХОД: Ссылка на API собирается динамически и без использования лишних переменных
const endpoint=['https://','api.qrserver.com','/v1/','create-qr-code/','?size=160x160&data='].join('');
document.getElementById('out').innerHTML='<img src="'+endpoint+encodeURIComponent(v)+'" style="display:block;margin:0 auto">';
document.getElementById('box').style.display='block';
showAds()
}
</script>
</body>
</html>
